# Pull requests: build check only. Pushes to main: build artwork + APK on Windows (same toolchain as locally) and publish a
# GitHub release that TVs pick up through their "Ny version" notice.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      LINT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Version code (minutes since 1970, same scheme as local builds)
        run: echo "VERSION_CODE=$(( $(date +%s) / 60 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: python -m pip install --quiet pillow numpy svgelements==1.9.6

      - name: Android SDK packages
        run: |
          SDKM="$(cygpath -u "$ANDROID_HOME")/cmdline-tools/latest/bin/sdkmanager.bat"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "GLASS_SDK=$(cygpath -u "$ANDROID_HOME")" >> "$GITHUB_ENV"

      - name: Signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > debug.keystore

      - name: Artwork (logos, glass buttons, gradient wallpaper)
        run: |
          python artwork/fetch_logos.py
          python artwork/make_assets.py

      - name: Build APK + share zip
        run: |
          bash build.sh
          bash make-share.sh

      - uses: actions/upload-artifact@v4
        with:
          name: glass-home-${{ env.VERSION_NAME }}
          path: |
            glass-home.apk
            glass-home-share.zip

      - name: GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" glass-home.apk glass-home-share.zip \
            --title "Glass Home $VERSION_NAME" \
            --generate-notes \
            --notes "Install: download **glass-home-share.zip**, unzip, double-click \`install-glass-home.bat\` (see README). Already installed? The TV shows \"Ny version\" on its home screen, or run the installer again: settings are kept.

          <!-- versionCode=$VERSION_CODE (read by the TV's updater) -->"
